baseURL = 'https://stephanielinme.com/'
defaultContentLanguage = 'zh-cn'
locale = 'zh-cn'
title = 'Stephanie Lin'
theme = 'PaperMod'
copyright = '© 2026 Stephanie Lin'

# 启用 emoji 和相对路径
enableEmoji = true
relativeURLs = true

# SEO：生成 robots.txt，方便被搜索引擎抓取和收录
enableRobotsTXT = true

# 允许文章中嵌入 HTML（排版必须）
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  # 站点默认描述（用于非首页页面的meta description兜底、OG等）
  description = "写给35+、有国际视野的职场人。关于职业转型、精力管理、跨国迁移与更有选择权的工作和生活。"
  author = "Stephanie Lin"

  # PaperMod 默认主题模式
  defaultTheme = 'auto'  # 自动跟随系统（亮/暗）
  disableThemeToggle = true  # 不显示手动切换按钮（月亮图标），保留自动跟随系统

  # 隐藏部分界面元素（按需开启）
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true

  # 社交链接（按需添加）
  [[params.socialIcons]]
    name = "email"
    url = "mailto:stephanie@stephanielinme.com"

[menu]
  [[menu.main]]
    name = "文章"
    pageRef = "/posts"
    weight = 10
  [[menu.main]]
    name = "关于"
    pageRef = "/about"
    weight = 20
  [[menu.main]]
    name = "订阅"
    pageRef = "/subscribe"
    weight = 30
